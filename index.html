<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dasher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg-0: #0b1024;
        --bg-1: #131a36;
        --bg-2: #1b2348;
        --border: rgba(148, 163, 184, 0.15);
        --border-strong: rgba(148, 163, 184, 0.3);
        --text-0: #f1f5f9;
        --text-1: #cbd5e1;
        --text-2: #94a3b8;
        --accent: #60a5fa;
        --accent-2: #a78bfa;
        --good: #34d399;
        --warn: #fbbf24;
        --bad: #f87171;
        --shadow: 0 10px 30px rgba(2, 6, 23, 0.5);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: var(--text-0);
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(96, 165, 250, 0.18), transparent 60%),
          radial-gradient(900px 500px at 100% 0%, rgba(167, 139, 250, 0.18), transparent 60%),
          linear-gradient(180deg, #070a1c 0%, #0b1024 100%);
        min-height: 100vh;
      }

      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }

      .header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.25rem;
      }

      .title-group h1 {
        margin: 0;
        font-size: 2rem;
        letter-spacing: -0.02em;
        background: linear-gradient(90deg, #ffffff 0%, #c7d2fe 60%, #a78bfa 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .title-group p {
        margin: 0.25rem 0 0;
        color: var(--text-2);
        font-size: 0.95rem;
      }

      .settings-link {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.5rem 0.9rem;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.08);
        border: 1px solid var(--border);
        color: var(--text-1);
        text-decoration: none;
        font-weight: 500;
        transition: background 0.2s, border-color 0.2s, color 0.2s;
      }

      .settings-link:hover {
        background: rgba(96, 165, 250, 0.12);
        border-color: var(--accent);
        color: #fff;
      }

      .panel {
        display: grid;
        gap: 0.85rem;
        background: linear-gradient(180deg, rgba(27, 35, 72, 0.85), rgba(19, 26, 54, 0.85));
        backdrop-filter: blur(8px);
        padding: 1.1rem 1.25rem;
        border-radius: 1rem;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }

      .panel-row {
        display: flex;
        flex-wrap: wrap;
        gap: 1.25rem;
        align-items: center;
        justify-content: space-between;
      }

      .setting-stack {
        display: grid;
        gap: 0.25rem;
        font-size: 0.9rem;
      }

      .setting-label {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.7rem;
        color: var(--text-2);
      }

      .setting-value {
        font-family: "JetBrains Mono", "Courier New", monospace;
        color: var(--text-0);
        margin: 0;
        word-break: break-all;
      }

      .button-row {
        display: flex;
        gap: 0.6rem;
      }

      button {
        font: inherit;
        padding: 0.55rem 1.1rem;
        border-radius: 0.6rem;
        border: 1px solid transparent;
        cursor: pointer;
        font-weight: 600;
        transition: transform 0.05s ease, background 0.2s, border-color 0.2s;
      }

      button:active {
        transform: translateY(1px);
      }

      #connect-button {
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: #fff;
        box-shadow: 0 6px 20px rgba(124, 58, 237, 0.35);
      }

      #connect-button:hover {
        background: linear-gradient(135deg, #1d4ed8, #6d28d9);
      }

      #disconnect-button {
        background: rgba(148, 163, 184, 0.08);
        color: var(--text-1);
        border-color: var(--border-strong);
      }

      #disconnect-button:hover {
        background: rgba(248, 113, 113, 0.12);
        color: #fecaca;
        border-color: rgba(248, 113, 113, 0.4);
      }

      .status {
        margin: 0;
        font-size: 0.95rem;
        color: var(--text-1);
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }

      .status::before {
        content: "";
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: var(--text-2);
        box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.15);
      }

      .status[data-state="connected"]::before {
        background: var(--good);
        box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.18);
      }

      .status[data-state="connecting"]::before {
        background: var(--warn);
        box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.18);
      }

      .status[data-state="error"]::before {
        background: var(--bad);
        box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.18);
      }

      .room-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin: 1.25rem 0 0;
        padding: 0;
      }

      .room-link {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.4rem 0.85rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        text-decoration: none;
        color: var(--text-1);
        background: rgba(148, 163, 184, 0.06);
        font-size: 0.85rem;
        transition: background 0.2s, border-color 0.2s, color 0.2s;
      }

      .room-link:hover {
        border-color: var(--accent);
        color: #fff;
        background: rgba(96, 165, 250, 0.12);
      }

      .room-link .pill {
        background: rgba(148, 163, 184, 0.15);
        color: var(--text-1);
        padding: 0.05rem 0.45rem;
        border-radius: 999px;
        font-size: 0.72rem;
      }

      .rooms-grid {
        margin-top: 1.25rem;
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      }

      .room-card {
        position: relative;
        background: linear-gradient(180deg, rgba(27, 35, 72, 0.9), rgba(19, 26, 54, 0.9));
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1rem 1.1rem;
        box-shadow: var(--shadow);
        overflow: hidden;
        transition: transform 0.2s ease, border-color 0.2s ease;
      }

      .room-card:hover {
        transform: translateY(-2px);
        border-color: var(--border-strong);
      }

      .room-card::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 3px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        opacity: 0.85;
      }

      .room-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.6rem;
      }

      .room-icon {
        width: 2.4rem;
        height: 2.4rem;
        border-radius: 0.7rem;
        background: linear-gradient(135deg, rgba(96, 165, 250, 0.25), rgba(167, 139, 250, 0.25));
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        border: 1px solid var(--border);
      }

      .room-title {
        display: flex;
        flex-direction: column;
      }

      .room-title h2 {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 600;
      }

      .room-title small {
        color: var(--text-2);
        font-size: 0.75rem;
      }

      .entity-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .entity-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
        padding: 0.55rem 0;
        border-bottom: 1px dashed var(--border);
      }

      .entity-item:last-child {
        border-bottom: 0;
      }

      .entity-label {
        color: var(--text-1);
        font-size: 0.9rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .entity-state {
        font-weight: 600;
        font-size: 0.78rem;
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.12);
        color: var(--text-1);
        text-transform: capitalize;
        white-space: nowrap;
      }

      .entity-state[data-tone="good"] {
        background: rgba(52, 211, 153, 0.15);
        color: #6ee7b7;
      }

      .entity-state[data-tone="bad"] {
        background: rgba(248, 113, 113, 0.15);
        color: #fca5a5;
      }

      .entity-state[data-tone="warn"] {
        background: rgba(251, 191, 36, 0.15);
        color: #fcd34d;
      }

      .entity-state[data-tone="info"] {
        background: rgba(96, 165, 250, 0.15);
        color: #bfdbfe;
      }

      .empty-room,
      .empty-state {
        margin: 0.5rem 0;
        color: var(--text-2);
        font-size: 0.85rem;
      }

      @media (max-width: 640px) {
        main {
          padding: 1.25rem 1rem 2rem;
        }

        .header-row {
          flex-direction: column;
          align-items: flex-start;
        }

        .panel-row {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="header-row">
        <div class="title-group">
          <h1>Welcome Home</h1>
          <p>Your rooms at a glance, powered by Home Assistant</p>
        </div>
        <a class="settings-link" href="./settings.html">
          <span aria-hidden="true">⚙️</span> Settings
        </a>
      </div>
      <section class="panel" aria-label="Connection settings">
        <div class="panel-row">
          <div class="setting-stack">
            <span class="setting-label">Home Assistant URL</span>
            <p id="configured-url" class="setting-value">Not configured</p>
          </div>
          <div class="setting-stack">
            <span class="setting-label">Access token</span>
            <p id="configured-token" class="setting-value">Not configured</p>
          </div>
          <div class="button-row">
            <button id="connect-button" type="button">Connect</button>
            <button id="disconnect-button" type="button">Disconnect</button>
          </div>
        </div>
        <p id="status" class="status" data-state="idle">Disconnected.</p>
      </section>
      <nav id="room-nav" class="room-nav" aria-label="Room navigation"></nav>
      <section id="rooms" class="rooms-grid" aria-label="Rooms dashboard"></section>
    </main>
    <script type="module" src="./src/app.mjs"></script>
  </body>
</html>
