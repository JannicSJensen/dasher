<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dasher</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }

      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }

      h1 {
        margin-top: 0;
      }

      .panel {
        display: grid;
        gap: 0.75rem;
        background: #1e293b;
        padding: 1rem;
        border-radius: 0.5rem;
        border: 1px solid #334155;
      }

      .header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }

      .title-group p {
        margin: 0.25rem 0 0;
        color: #93c5fd;
      }

      .settings-link {
        color: #93c5fd;
      }

      .settings-link:hover {
        color: #bfdbfe;
      }

      .setting-value {
        font-family: "Courier New", monospace;
        color: #cbd5e1;
        margin: 0;
      }

      .button-row {
        display: flex;
        gap: 0.75rem;
      }

      button {
        width: fit-content;
        padding: 0.5rem 1rem;
        background: #2563eb;
        color: #fff;
        border: 0;
        border-radius: 0.375rem;
        cursor: pointer;
      }

      .status {
        margin-top: 1rem;
        font-weight: 700;
      }

      .room-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin: 1rem 0 0;
        padding: 0;
      }

      .room-link {
        display: inline-block;
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        border: 1px solid #334155;
        text-decoration: none;
        color: #cbd5e1;
        background: #0b1220;
      }

      .room-link:hover {
        border-color: #60a5fa;
        color: #dbeafe;
      }

      .rooms-grid {
        margin-top: 1rem;
        display: grid;
        gap: 0.75rem;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }

      .room-card {
        background: #111827;
        border: 1px solid #334155;
        border-radius: 0.5rem;
        padding: 0.75rem;
      }

      .room-card h2 {
        margin: 0 0 0.5rem;
        font-size: 1.05rem;
      }

      .entity-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .entity-item {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem;
        border-bottom: 1px solid #334155;
      }

      .entity-item:last-child {
        border-bottom: 0;
      }

      .empty-room,
      .empty-state {
        margin: 0;
        color: #94a3b8;
      }

      @media (max-width: 640px) {
        .header-row {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="header-row">
        <div class="title-group">
          <h1>Welcome Home</h1>
          <p>Classic room overview powered by Home Assistant areas</p>
        </div>
        <a class="settings-link" href="./settings.html">Settings</a>
      </div>
      <section class="panel" aria-label="Connection settings">
        <p id="configured-url" class="setting-value">URL: Not configured</p>
        <p id="configured-token" class="setting-value">Token: Not configured</p>
        <div class="button-row">
          <button id="connect-button" type="button">Connect</button>
          <button id="disconnect-button" type="button">Disconnect</button>
        </div>
      </section>
      <p id="status" class="status">Disconnected.</p>
      <nav id="room-nav" class="room-nav" aria-label="Room navigation"></nav>
      <section id="rooms" class="rooms-grid" aria-label="Rooms dashboard"></section>
    </main>
    <script type="module" src="./src/app.mjs"></script>
  </body>
</html>
