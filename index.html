<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dasher</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }

      main {
        max-width: 900px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }

      h1 {
        margin-top: 0;
      }

      form {
        display: grid;
        gap: 0.75rem;
        background: #1e293b;
        padding: 1rem;
        border-radius: 0.5rem;
      }

      label {
        display: grid;
        gap: 0.25rem;
      }

      input {
        padding: 0.5rem;
        border: 1px solid #334155;
        border-radius: 0.375rem;
        background: #0f172a;
        color: #e2e8f0;
      }

      button {
        width: fit-content;
        padding: 0.5rem 1rem;
        background: #2563eb;
        color: #fff;
        border: 0;
        border-radius: 0.375rem;
        cursor: pointer;
      }

      .status {
        margin-top: 1rem;
        font-weight: 700;
      }

      ul {
        list-style: none;
        margin: 1rem 0 0;
        padding: 0;
      }

      li {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem;
        border-bottom: 1px solid #334155;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Home Assistant Dashboard</h1>
      <form id="connection-form">
        <label>
          Home Assistant URL
          <input id="base-url" type="url" required placeholder="http://homeassistant.local:8123" />
        </label>
        <label>
          Long-lived access token
          <input id="access-token" type="password" required />
        </label>
        <button type="submit">Connect</button>
      </form>
      <p id="status" class="status">Disconnected</p>
      <ul id="entities"></ul>
    </main>
    <script type="module" src="./src/app.mjs"></script>
  </body>
</html>
