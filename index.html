<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1024" />
    <title>Dasher · Home Assistant</title>

    <!-- Design system: tokens → themes → layout & components -->
    <link rel="stylesheet" href="./assets/styles/variables.css" />
    <link rel="stylesheet" href="./assets/styles/themes.css" />
    <link rel="stylesheet" href="./assets/styles/main.css" />
  </head>
  <body data-theme="dark">
    <!--
      App shell. JS components mount into these slots.
      Sidebar is shown on desktop. Bottom nav is shown on mobile.
      Topbar holds title + connection status + theme toggle.
    -->
    <div id="app" class="app-shell">
      <aside id="app-sidebar" class="app-sidebar" aria-label="Hovednavigation"></aside>
      <div class="app-main">
        <header id="app-topbar" class="app-topbar"></header>
        <main id="app-outlet" class="app-outlet" role="main"></main>
        <nav id="app-bottomnav" class="app-bottomnav" aria-label="Mobile navigation"></nav>
      </div>
    </div>

    <!-- Toast region for transient messages (errors, reconnect status). -->
    <div id="app-toasts" class="toast-host" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
